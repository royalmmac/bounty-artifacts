  <text x="112" y="122" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="600" letter-spacing="1.4">SWAP.IO HERMES x402 API  /  SOLANA &amp; BASE AGENT ARCHITECTURE</text>
  <text x="112" y="178" fill="#EDEDEF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="44" font-weight="700">FreelanceSplitBot: Pay-Per-Quote Treasury Agent</text>
  <text x="112" y="222" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="24">Eliminating $99/mo fixed API subscriptions via HTTP 402 Payment Required ($0.003007 USDC/call) &amp; PayAI gas sponsorship</text>
